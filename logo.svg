<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 96" width="398" height="96"
     role="img" aria-label="BuyWorldZa — More brands, better prices, delivered">
  <!-- Full lockup. Text is converted to outlines by scripts/make_logo.sh so the file carries no
       font dependency: it looks identical on a phone, on Windows and in a print shop. -->
  <defs>
    <linearGradient id="bwz-globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b7a5a"/>
      <stop offset=".5" stop-color="#0f8b8b"/>
      <stop offset="1" stop-color="#1f74c9"/>
    </linearGradient>
    <linearGradient id="bwz-cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b93f"/>
      <stop offset="1" stop-color="#e08a10"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(2,16)">
    <ellipse cx="25" cy="34" rx="27.5" ry="8.6" transform="rotate(-17 25 34)"
             fill="none" stroke="url(#bwz-globe)" stroke-width="3.4"/>
    <circle cx="25" cy="30" r="20" fill="url(#bwz-globe)"/>
    <path d="M5 30h40" stroke="#fff" stroke-opacity=".24" stroke-width="1.4"/>
    <ellipse cx="25" cy="30" rx="8.6" ry="20" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.4"/>
    <circle cx="45" cy="43.5" r="16" fill="#fff"/>
    <circle cx="45" cy="43.5" r="14.8" fill="url(#bwz-cart)"/>
    <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M35 34h4.6l3 13.6h11.2l3.2-10.6H39.4"/>
    </g>
    <circle cx="44" cy="53.4" r="2.5" fill="#fff"/>
    <circle cx="52.8" cy="53.4" r="2.5" fill="#fff"/>
  </g>

  <!-- wordmark: Buy (ink) · World (blue, the globe) · Za (amber, where we deliver) -->
  <text x="76" y="55" font-family="Segoe UI, Verdana, DejaVu Sans, sans-serif"
        font-size="37" font-weight="800" letter-spacing="-1.1" transform="skewX(-4)">
    <tspan fill="#0e1a16">Buy</tspan><tspan fill="#1463b0">World</tspan><tspan fill="#b8730a">Za</tspan>
  </text>
  <text x="78" y="76" font-family="Segoe UI, Verdana, DejaVu Sans, sans-serif"
        font-size="8.7" font-weight="700" letter-spacing="2.3" fill="#5d6b66">
    MORE BRANDS · BETTER PRICES · DELIVERED
  </text>
</svg>
